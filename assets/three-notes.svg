 <text x="28" y="145" font-family="Georgia, serif" font-size="22" fill="#2c2824">make it useful.</text>
</g>
<g transform="translate(805 45) rotate(-3)">
 <rect width="320" height="165" rx="12" fill="#dfe8d8" stroke="#2c2824" stroke-width="5"/>
 <path d="M28 36 h75" stroke="#7d55ba" stroke-width="7" stroke-linecap="round"/>
 <text x="28" y="77" font-family="Georgia, serif" font-size="33" font-style="italic" fill="#2c2824">computers</text>
 <path d="M28 104 q100 -17 210 0" stroke="#2c2824" stroke-width="5" fill="none"/>
 <text x="28" y="145" font-family="Georgia, serif" font-size="22" fill="#2c2824">let them feel alive.</text>
</g>
<path d="M381 235 q85 20 154 0" stroke="#d94841" stroke-width="5" fill="none" stroke-linecap="round"/>
