<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-label="Three illustrated notes about attention, information, and computers">
<rect width="1200" height="270" rx="26" fill="#eee1ca"/>
<g transform="translate(75 45) rotate(-4)">
 <rect width="320" height="165" rx="12" fill="#f5e2a8" stroke="#2c2824" stroke-width="5"/>
 <path d="M28 36 h75" stroke="#d94841" stroke-width="7" stroke-linecap="round"/>
 <text x="28" y="77" font-family="Georgia, serif" font-size="33" font-style="italic" fill="#2c2824">attention</text>
 <path d="M28 104 q100 -17 210 0" stroke="#2c2824" stroke-width="5" fill="none"/>
 <text x="28" y="145" font-family="Georgia, serif" font-size="22" fill="#2c2824">stay in charge.</text>
</g>
<g transform="translate(440 48) rotate(2)">
 <rect width="320" height="165" rx="12" fill="#fff8e9" stroke="#2c2824" stroke-width="5"/>
 <path d="M28 36 h75" stroke="#2f67c8" stroke-width="7" stroke-linecap="round"/>
 <text x="28" y="77" font-family="Georgia, serif" font-size="33" font-style="italic" fill="#2c2824">information</text>
