  <!-- touchpad -->
  <path d="M340 438L456 437L466 458L329 459L340 438Z" fill="#292929" stroke="#101010" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M344 441L452 440" stroke="#484848" stroke-width="1" stroke-linecap="round" opacity=".7"/>

  <!-- Thinkiee wordmark, seated naturally on the right palm rest -->
  <g transform="rotate(-3 582 445)">
    <text x="548" y="449" fill="#A9A9A4" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="800" letter-spacing="-.65">Thinkiee</text>
    <circle cx="565.2" cy="438.1" r="2" fill="#D8453B"/>
