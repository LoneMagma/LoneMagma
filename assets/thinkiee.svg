<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="75 55 640 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Thinkiee — ThinkPad L490</title>
  <desc id="desc">A transparent, flat two-dimensional illustration of an open black ThinkPad L490, with balanced proportions, a red TrackPoint, centered touchpad, Arch Linux fastfetch output, and the name Thinkiee on the palm rest.</desc>

  <defs>
    <linearGradient id="screenGlow" x1="290" y1="128" x2="500" y2="333" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263234"/>
      <stop offset="1" stop-color="#161D1F"/>
    </linearGradient>

    <linearGradient id="deck" x1="180" y1="353" x2="594" y2="486" gradientUnits="userSpaceOnUse">
      <stop stop-color="#353535"/>
      <stop offset="1" stop-color="#202020"/>
    </linearGradient>

    <clipPath id="screenClip">
      <path d="M221 113L548 100L565 337L206 343L221 113Z"/>
    </clipPath>

    <style>
      .ink { stroke: #20201e; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .fine { stroke: #20201e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .key { fill: #454545; stroke: #171716; stroke-width: 1.6; }
      .keycap { fill: #bdb9ad; font: 700 6px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; }
      .terminal { fill: #c8d9c6; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fetch { font-size: 5.15px; font-weight: 500; }
      .fetch-label { fill: #79A7D3; font-weight: 700; }
      .arch { fill: #66A6D9; font-size: 5.3px; font-weight: 700; }
      .cursor { animation: cursor-blink 1.45s steps(1, end) infinite; }
      @keyframes cursor-blink { 0%, 48% { opacity: .85; } 49%, 100% { opacity: .12; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <!-- display lid -->
  <path d="M198 88L568 75C584 75 592 85 594 102L611 349L173 355L186 106C187 96 190 91 198 88Z" fill="#292929" class="ink"/>
  <path d="M221 113L548 100L565 337L206 343L221 113Z" fill="url(#screenGlow)" stroke="#111110" stroke-width="5" stroke-linejoin="round"/>
  <path d="M385 89C390 89 394 92 394 96C394 100 391 102 386 102C382 102 378 99 378 95C378 92 381 89 385 89Z" fill="#0E0E0E"/>
  <circle cx="386" cy="95" r="2.2" fill="#67787A"/>
  <circle cx="568" cy="92" r="2.4" fill="#80A069"/>

  <!-- screen content -->
  <g clip-path="url(#screenClip)">
    <path d="M228 124L554 113L555 140L226 148L228 124Z" fill="#111819" opacity=".9"/>
    <circle cx="241" cy="135" r="3.5" fill="#D9604C"/>
    <circle cx="253" cy="135" r="3.5" fill="#D5AF58"/>
    <circle cx="265" cy="134" r="3.5" fill="#719469"/>
    <text x="283" y="137" class="terminal" font-size="8" font-weight="600" fill="#879897">solosortie@thinkiee: ~</text>

    <!-- the user's real fastfetch output, fitted to the L490 display -->
    <g transform="rotate(-1.05 384 227) translate(66 38) scale(.82 .78)" class="terminal fetch">
      <text x="236" y="158" fill="#D5AF58">[solosortie@thinkiee ~]$ fastfetch</text>

      <text x="237" y="174" class="arch">
        <tspan x="237" dy="0">                 -`</tspan>
        <tspan x="237" dy="7">                .o+`</tspan>
        <tspan x="237" dy="7">               `ooo/</tspan>
        <tspan x="237" dy="7">              `+oooo:</tspan>
        <tspan x="237" dy="7">             `+oooooo:</tspan>
        <tspan x="237" dy="7">             -+oooooo+:</tspan>
        <tspan x="237" dy="7">           `/:-:++oooo+:</tspan>
        <tspan x="237" dy="7">          `/++++/+++++++:</tspan>
        <tspan x="237" dy="7">         `/++++++++++++++:</tspan>
        <tspan x="237" dy="7">        `/+++ooooooooooooo/`</tspan>
        <tspan x="237" dy="7">       ./ooosssso++osssssso+`</tspan>
        <tspan x="237" dy="7">      .oossssso-````/ossssss+`</tspan>
        <tspan x="237" dy="7">     -osssssso.      :ssssssso.</tspan>
        <tspan x="237" dy="7">    :osssssss/        osssso+++.</tspan>
        <tspan x="237" dy="7">   /ossssssss/        +ssssooo/-</tspan>
        <tspan x="237" dy="7"> `/ossssso+/:-        -:/+osssso+-</tspan>
        <tspan x="237" dy="7">`+sso+:-`                `.-/+oso:</tspan>
        <tspan x="237" dy="7">`++:.                       `-/+/</tspan>
        <tspan x="237" dy="7">.`                              `/</tspan>
      </text>

      <text x="363" y="174" fill="#C8D9C6">
        <tspan x="363" dy="0" fill="#79A7D3" font-weight="700">solosortie@thinkiee</tspan>
        <tspan x="363" dy="7">-------------------</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">OS</tspan>: Arch Linux x86_64</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Host</tspan>: 20Q6S2WR01 (ThinkPad L490)</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Kernel</tspan>: Linux 7.1.3-arch1-1</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Uptime</tspan>: 13 hours, 24 mins</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Packages</tspan>: 19 (flatpak), 1295 (pacman)</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Shell</tspan>: bash 5.3.15</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Display (BOE0791)</tspan>: 1920x1080 @ 1.2x</tspan>
        <tspan x="363" dy="7">in 14&quot;, 60 Hz [Built-in]</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">DE</tspan>: KDE Plasma 6.7.2</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">WM</tspan>: KWin (Wayland)</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">WM Theme</tspan>: Breeze</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Theme</tspan>: Breeze (Dark) [Qt], Breeze-Dark</tspan>
        <tspan x="363" dy="7">[GTK2], Breeze [GTK3]</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Icons</tspan>: breeze-dark [Qt], breeze-dark [GTK2/3/4]</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Font</tspan>: Noto Sans (10pt) [Qt], Noto Sans (10pt) [GTK2/3/4]</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Cursor</tspan>: breeze (24px)</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Terminal</tspan>: konsole 26.4.3</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">CPU</tspan>: Intel(R) Core(TM) i5-8365U (8) @ 4.10 GHz</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">GPU</tspan>: Intel UHD Graphics 620 @ 1.10 GHz [Integrated]</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Memory</tspan>: 4.79 GiB / 7.40 GiB (65%)</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Swap</tspan>: 1.30 GiB / 4.00 GiB (33%)</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Disk (/)</tspan>: 184.38 GiB / 232.69 GiB (79%) - ext4</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Local IP (wlan0)</tspan>: 192.168.0.108/24</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Battery (5B10W138)</tspan>: 79% [AC Connected]</tspan>
        <tspan x="363" dy="7"><tspan class="fetch-label">Locale</tspan>: en_US.UTF-8</tspan>
      </text>

      <text x="236" y="329" fill="#D5AF58">[solosortie@thinkiee ~]$</text>
      <rect class="cursor" x="318" y="324" width="4" height="6" rx=".5" fill="#C8D9C6" opacity=".85"/>
    </g>
  </g>

  <!-- hinges -->
  <path d="M193 345L271 343L270 364L188 366Z" fill="#141414" class="fine"/>
  <path d="M505 341L582 340L590 359L510 361Z" fill="#141414" class="fine"/>
  <path d="M201 351L262 349" stroke="#696969" stroke-width="3" stroke-linecap="round"/>
  <path d="M518 348L575 347" stroke="#696969" stroke-width="3" stroke-linecap="round"/>

  <!-- lower chassis -->
  <path d="M174 355L610 349L680 438L652 456C643 462 632 464 620 464L181 468C165 467 150 462 138 456L107 442L174 355Z" fill="url(#deck)" class="ink"/>
  <path d="M108 442C234 458 550 457 680 438L652 456C643 462 632 464 620 464L181 468C165 467 150 462 138 456L108 442Z" fill="#1A1A1A" stroke="#20201E" stroke-width="4" stroke-linejoin="round"/>
  <path d="M139 453C252 463 548 462 651 452" stroke="#686868" stroke-width="2" stroke-linecap="round" opacity=".72"/>

  <!-- keyboard bed -->
  <path d="M201 363L568 359L604 420L170 426L201 363Z" fill="#171717" stroke="#111110" stroke-width="3" stroke-linejoin="round"/>

  <!-- L490 power button -->
  <circle cx="574" cy="365" r="5.2" fill="#222" stroke="#101010" stroke-width="1.6"/>
  <path d="M574 362V365M572 363.5C569.5 367 572 369.5 574.5 369.5C577 369.5 579 366.5 576.5 363.5" stroke="#8A8A86" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- keyboard, row 1 -->
  <g transform="matrix(1 -.02 .36 .55 202 369)">
    <rect class="key" x="0" y="0" width="19" height="17" rx="3"/><rect class="key" x="23" y="0" width="19" height="17" rx="3"/><rect class="key" x="46" y="0" width="19" height="17" rx="3"/><rect class="key" x="69" y="0" width="19" height="17" rx="3"/><rect class="key" x="92" y="0" width="19" height="17" rx="3"/><rect class="key" x="115" y="0" width="19" height="17" rx="3"/><rect class="key" x="138" y="0" width="19" height="17" rx="3"/><rect class="key" x="161" y="0" width="19" height="17" rx="3"/><rect class="key" x="184" y="0" width="19" height="17" rx="3"/><rect class="key" x="207" y="0" width="19" height="17" rx="3"/><rect class="key" x="230" y="0" width="19" height="17" rx="3"/><rect class="key" x="253" y="0" width="19" height="17" rx="3"/><rect class="key" x="276" y="0" width="28" height="17" rx="3"/>
    <rect class="key" x="0" y="22" width="29" height="18" rx="3"/><rect class="key" x="33" y="22" width="19" height="18" rx="3"/><rect class="key" x="56" y="22" width="19" height="18" rx="3"/><rect class="key" x="79" y="22" width="19" height="18" rx="3"/><rect class="key" x="102" y="22" width="19" height="18" rx="3"/><rect class="key" x="125" y="22" width="19" height="18" rx="3"/><rect class="key" x="148" y="22" width="19" height="18" rx="3"/><rect class="key" x="171" y="22" width="19" height="18" rx="3"/><rect class="key" x="194" y="22" width="19" height="18" rx="3"/><rect class="key" x="217" y="22" width="19" height="18" rx="3"/><rect class="key" x="240" y="22" width="19" height="18" rx="3"/><rect class="key" x="263" y="22" width="41" height="18" rx="3"/>
    <rect class="key" x="0" y="45" width="36" height="18" rx="3"/><rect class="key" x="40" y="45" width="19" height="18" rx="3"/><rect class="key" x="63" y="45" width="19" height="18" rx="3"/><rect class="key" x="86" y="45" width="19" height="18" rx="3"/><rect class="key" x="109" y="45" width="19" height="18" rx="3"/><rect class="key" x="132" y="45" width="19" height="18" rx="3"/><rect class="key" x="155" y="45" width="19" height="18" rx="3"/><rect class="key" x="178" y="45" width="19" height="18" rx="3"/><rect class="key" x="201" y="45" width="19" height="18" rx="3"/><rect class="key" x="224" y="45" width="19" height="18" rx="3"/><rect class="key" x="247" y="45" width="57" height="18" rx="3"/>
    <rect class="key" x="0" y="68" width="46" height="18" rx="3"/><rect class="key" x="50" y="68" width="19" height="18" rx="3"/><rect class="key" x="73" y="68" width="19" height="18" rx="3"/><rect class="key" x="96" y="68" width="19" height="18" rx="3"/><rect class="key" x="119" y="68" width="19" height="18" rx="3"/><rect class="key" x="142" y="68" width="19" height="18" rx="3"/><rect class="key" x="165" y="68" width="19" height="18" rx="3"/><rect class="key" x="188" y="68" width="19" height="18" rx="3"/><rect class="key" x="211" y="68" width="19" height="18" rx="3"/><rect class="key" x="234" y="68" width="70" height="18" rx="3"/>
  </g>

  <!-- the unmistakable red TrackPoint -->
  <circle cx="389" cy="398" r="7" fill="#D8453B" stroke="#151515" stroke-width="2.5"/>
  <path d="M385 396L392 400M389 394L387 402M393 395L385 400" stroke="#8D251F" stroke-width="1" stroke-linecap="round"/>

  <!-- physical TrackPoint buttons -->
  <path d="M329 426L372 426L376 436L328 436Z" fill="#3E3E3E" class="fine"/>
  <path d="M376 426L418 426L420 436L377 436Z" fill="#3E3E3E" class="fine"/>
  <path d="M422 426L465 425L469 435L423 436Z" fill="#3E3E3E" class="fine"/>
