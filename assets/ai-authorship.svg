  <path d="M18 114Q-10 74 12 42" fill="none" stroke="#E26A5B" stroke-width="5" stroke-linecap="round"/>
  <path d="M12 42l5 18-18-5" fill="none" stroke="#E26A5B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="0" y="268" font-family="Georgia,serif" font-size="22" fill="#E26A5B">lowering the entry fee, not the stakes.</text>
