<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<rect width="1200" height="320" rx="24" fill="#F4EAD8"/>
<g transform="translate(72 44)">
  <path d="M0 28Q80 8 150 22T308 25" fill="none" stroke="#D7C5AE" stroke-width="3"/>
  <text x="0" y="78" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#1E1A17">AI is in the toolbox.</text>
  <text x="0" y="116" font-family="Trebuchet MS,Arial,sans-serif" font-size="23" fill="#5A5149">not the driver's seat.</text>
  <rect x="0" y="142" width="568" height="104" rx="16" fill="#FFFDF7" stroke="#1E1A17" stroke-width="4"/>
  <text x="22" y="174" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" fill="#1E1A17">Most of my software is AI-assisted.</text>
  <text x="22" y="204" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" fill="#1E1A17">I still decide what gets built, kept,</text>
  <text x="22" y="234" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" fill="#1E1A17">rewritten, or thrown into the bin.</text>
</g>

