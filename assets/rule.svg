<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" result="g"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#251F1A" flood-opacity="0.18"/>
    </filter>
    <pattern id="fibers" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M3 8h11 M21 22h8 M7 30h7" stroke="#3C332D" stroke-opacity="0.07" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="28" cy="7" r="0.9" fill="#3C332D" opacity="0.07"/>
    </pattern>
    <style>
      .ink{stroke:#251F1A;stroke-linecap:round;stroke-linejoin:round}
      .scribble{fill:none;stroke:#251F1A;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .fine{fill:none;stroke:#251F1A;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .paper{filter:url(#shadow)}
      .grain{filter:url(#grain)}
      .label{font-family:Georgia, 'Times New Roman', serif; fill:#251F1A}
      .hand{font-family:'Comic Sans MS','Bradley Hand',cursive; fill:#251F1A}
    </style>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="#F7EEDB"/>
  <rect x="10" y="10" width="1180" height="480" rx="22" fill="url(#fibers)" opacity="0.9"/>
  
<path d="M36 190 C160 161 263 202 388 183 C514 164 625 201 752 181 C882 160 1007 201 1160 178" class="scribble" stroke="#D85B48"/>
<path d="M44 203 C187 187 305 212 420 198 C558 181 685 214 823 195 C952 178 1067 212 1152 197" class="fine" opacity="0.55"/>
<circle cx="104" cy="186" r="10" fill="#E0A233"/>
<circle cx="1090" cy="193" r="8" fill="#6D7CCF"/>

</svg>